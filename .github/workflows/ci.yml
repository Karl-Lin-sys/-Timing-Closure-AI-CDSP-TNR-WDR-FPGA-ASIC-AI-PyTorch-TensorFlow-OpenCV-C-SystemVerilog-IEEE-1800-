name: AI+CDSP Compiler, C++20 & IEEE 1800-2023 RTL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-full-stack:
    name: Python Compiler + C++20 Golden + SystemVerilog RTL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies (CPU-only PyTorch, NumPy & OpenCV)
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Step 1 - Run End-to-End Co-Simulation (PyTorch Compiler -> C++ Golden -> SystemVerilog RTL)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python run_full_co_sim.py
          python compiler/demo_visual_comparison.py
          test -f compiled_cdsp_rom.json
          test -f ai_cdsp_wave.vcd
          test -f assets/cdsp_before_after_demo.png
          test -f assets/rtl_pipeline_waveform.png
